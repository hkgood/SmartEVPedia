<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 背景圆形 -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00CC99;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00CC99;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FF99;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 外圈 -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" />
  <circle cx="100" cy="100" r="80" fill="#0A0A0F" />
  
  <!-- 汽车轮廓简化版 - 代表"车" -->
  <path d="M45 95 L55 75 L75 70 L95 65 L115 65 L135 70 L145 80 L150 95 L145 105 L130 110 L115 112 L95 112 L75 110 L55 108 L50 100 Z" 
        fill="url(#grad2)" opacity="0.9"/>
  
  <!-- 闪电符号 - 代表"智驾/电能" -->
  <path d="M108 50 L95 80 L105 80 L95 110 L125 75 L112 75 L120 50 Z" 
        fill="#00FF99" stroke="#0A0A0F" stroke-width="2"/>
  
  <!-- 科技线条 - 环绕 -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#0066FF" stroke-width="1" stroke-dasharray="10 5" opacity="0.5"/>
  
  <!-- 齿轮/演进符号 - 代表"百科/系统" -->
  <circle cx="155" cy="55" r="15" fill="none" stroke="#00CC99" stroke-width="2"/>
  <circle cx="155" cy="55" r="5" fill="#00CC99"/>
  
  <!-- E 字样 - EV -->
  <text x="70" y="145" font-family="Arial Black, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">E</text>
  <text x="105" y="145" font-family="Arial Black, sans-serif" font-size="36" font-weight="bold" fill="#00FF99">V</text>
</svg>
